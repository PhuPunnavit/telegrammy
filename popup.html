<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18222d;
      color: #e5eaf0;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #64b5f6;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 12px;
      color: #90a4ae;
      line-height: 1.4;
      margin: 0 0 12px 0;
    }
    .status-box {
      background: #242f3d;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .badge-active {
      color: #4caf50;
      font-weight: 600;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #2481cc;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover {
      background: #1c73b9;
    }
    ul {
      margin: 8px 0;
      padding-left: 18px;
      font-size: 11px;
      color: #cfd8dc;
    }
    li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h2>⚡ TG Downloader</h2>
  <p>Capture videos, audio, images, and voice notes directly from Telegram Web.</p>

  <div class="status-box">
    Status: <span class="badge-active">Ready</span>
    <ul>
      <li>Unblocks restricted saving</li>
      <li>One-click overlay download button</li>
      <li>Batch export drawer on page</li>
    </ul>
  </div>

  <a class="btn" href="https://web.telegram.org/" target="_blank">Open Telegram Web</a>
</body>
</html>
